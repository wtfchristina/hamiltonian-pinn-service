apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinn-dynamics-service
  labels:
    app: pinn-dynamics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pinn-dynamics
  template:
    metadata:
      labels:
        app: pinn-dynamics
    spec:
      containers:
      - name: api
        image: pinn-dynamics:v1
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pinn-dynamics-svc
spec:
  type: NodePort
  selector:
    app: pinn-dynamics
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
